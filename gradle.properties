org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Publishing config lives in root build.gradle.kts (host, signing, POM).
# Signing credentials — `ORG_GRADLE_PROJECT_signingInMemoryKey` etc — come from CI secrets
# or ~/.gradle/gradle.properties for local publishing.
#
# Do NOT add SONATYPE_HOST / RELEASE_SIGNING_ENABLED here: the vanniktech plugin auto-reads
# them at apply time and finalizes internal properties, which conflicts with the programmatic
# `publishToMavenCentral(...)` / `signAllPublications()` calls.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
